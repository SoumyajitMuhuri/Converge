<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Converge visit tracking flow</title>
  <desc id="desc">A visitor opens a short link. The API redirects and queues a visit. The worker records the visit and publishes an event. The dashboard refreshes its analytics.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#6A7062" />
    </marker>
    <style>
      .title { font: 600 22px Inter, ui-sans-serif, system-ui, sans-serif; fill: #F1F3EF; }
      .label { font: 600 15px Inter, ui-sans-serif, system-ui, sans-serif; fill: #F1F3EF; }
      .copy { font: 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #D0D5CC; }
      .step { fill: #101611; stroke: #6A7062; stroke-width: 1.5; }
      .step-accent { fill: #3A5A40; stroke: #6A7062; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1100" height="300" rx="22" fill="#04030F" />
  <text x="36" y="46" class="title">Visit tracking flow</text>

  <rect x="36" y="92" width="225" height="150" rx="14" class="step" />
  <text x="58" y="128" class="label">1 · Open a short link</text>
  <text x="58" y="160" class="copy">Visitor requests /:code</text>
  <text x="58" y="186" class="copy">API redirects to destination</text>
  <text x="58" y="212" class="copy">Visit job enters Redis queue</text>

  <rect x="310" y="92" width="225" height="150" rx="14" class="step-accent" />
  <text x="332" y="128" class="label">2 · Process visit</text>
  <text x="332" y="160" class="copy">BullMQ worker consumes job</text>
  <text x="332" y="186" class="copy">Visit saved in MongoDB</text>
  <text x="332" y="212" class="copy">Event published to Redis</text>

  <rect x="584" y="92" width="225" height="150" rx="14" class="step" />
  <text x="606" y="128" class="label">3 · Notify dashboard</text>
  <text x="606" y="160" class="copy">API receives Pub/Sub event</text>
  <text x="606" y="186" class="copy">Sends event over SSE</text>
  <text x="606" y="212" class="copy">User-specific connection</text>

  <rect x="858" y="92" width="206" height="150" rx="14" class="step-accent" />
  <text x="880" y="128" class="label">4 · Refresh analytics</text>
  <text x="880" y="160" class="copy">Client fetches fresh totals</text>
  <text x="880" y="186" class="copy">Chart and link visits update</text>
  <text x="880" y="212" class="copy">No manual refresh needed</text>

  <path d="M261 167H310" fill="none" stroke="#6A7062" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M535 167H584" fill="none" stroke="#6A7062" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M809 167H858" fill="none" stroke="#6A7062" stroke-width="2" marker-end="url(#arrow)" />
</svg>
